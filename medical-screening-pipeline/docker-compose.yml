version: '3.8'

services:
  api:
    build: .
    container_name: medical_screening_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_observer
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always