name: CI/CD Medical Screening Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r medical-screening-pipeline/requirements.txt

    - name: Executar treinos e testes com pytest
      env:
        PYTHONPATH: "medical-screening-pipeline"
      run: |
        python medical-screening-pipeline/app/train.py
        pytest medical-screening-pipeline/tests/test_api.py