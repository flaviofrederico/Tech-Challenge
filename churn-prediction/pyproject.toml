[project]
name = "churn-prediction"
version = "1.0.0"
description = "Pipeline ML end-to-end para previsão de churn de clientes (Telco), com MLP em PyTorch, baselines em Scikit-Learn, tracking em MLflow e API de inferência em FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Grupo Tech Challenge - Fase 1" }
]

dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pandera>=0.18",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Ruff (linting + formatting)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI usa chamadas de função em defaults (Depends, Field) - padrão aceito
    "N803", # X, y são a convenção universal de ML (sklearn/PyTorch/literatura) p/ matriz de features e target
    "N806", # idem, para variáveis locais (X_train, X_val, X_transformed, etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # nomes de função de teste podem ser longos/descritivos

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["src/churn_prediction"]
omit = ["*/api/main.py"]
